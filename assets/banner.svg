<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#07172c"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2a4a" stroke-width="0.8" opacity="0.35"/>
      <circle cx="0" cy="0" r="1.5" fill="#00f2fe" opacity="0.4"/>
    </pattern>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Subtle glow circles -->
  <circle cx="200" cy="180" r="160" fill="url(#glow)"/>
  <circle cx="1000" cy="180" r="180" fill="url(#glow)"/>

  <!-- Logo Icon: Hexagon Radar / Autonomous Fact Synthesis -->
  <g transform="translate(130, 80)">
    <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" fill="none" stroke="url(#accent)" stroke-width="3" filter="url(#neon)"/>
    <polygon points="100,35 155,67 155,133 100,165 45,133 45,67" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <!-- Central Node Core -->
    <circle cx="100" cy="100" r="22" fill="#07172c" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="100" cy="100" r="10" fill="#00f2fe"/>
    <!-- Connecting radar lines -->
    <line x1="100" y1="10" x2="100" y2="78" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
    <line x1="180" y1="145" x2="119" y2="111" stroke="#4facfe" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="145" x2="81" y2="111" stroke="#4facfe" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title & Typography -->
  <text x="360" y="155" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#accent)" letter-spacing="4" filter="url(#neon)">
    DEEPCLAW
  </text>
  <text x="740" y="155" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="300" font-size="34" fill="#64748b">
    v0.1.0
  </text>

  <!-- Tagline -->
  <text x="364" y="205" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="600" font-size="20" fill="#e2e8f0" letter-spacing="1">
    Sovereign Autonomous Deep Research &amp; Fact-Synthesis Engine
  </text>
  <text x="364" y="235" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="400" font-size="15" fill="#94a3b8">
    Recursive Multi-Depth Investigation • Contradiction Detection • Multi-LLM Router • Real-Time WebSockets
  </text>

  <!-- Interactive Pill Tags -->
  <g transform="translate(364, 265)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#0f2744" stroke="#0284c7" stroke-width="1"/>
    <text x="65" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">RECURSIVE CRAWL</text>

    <rect x="142" y="0" width="135" height="28" rx="14" fill="#0f2744" stroke="#0284c7" stroke-width="1"/>
    <text x="209" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">FACT EXTRACTION</text>

    <rect x="289" y="0" width="150" height="28" rx="14" fill="#0f2744" stroke="#0284c7" stroke-width="1"/>
    <text x="364" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">CONTRADICTION AUDIT</text>

    <rect x="451" y="0" width="135" height="28" rx="14" fill="#0f2744" stroke="#0284c7" stroke-width="1"/>
    <text x="518" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">SQLITE WAL AUDIT</text>
  </g>
</svg>
