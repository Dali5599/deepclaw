[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepclaw"
version = "0.1.0"
description = "Autonomous Deep Research & Multi-Source Fact-Synthesis Engine with Real-Time Streaming and Sovereign SQLite WAL Audit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dali Mathlouthi", email = "dali@nexus.internal"}
]
keywords = ["deep-research", "ai-agents", "fact-synthesis", "multi-llm", "fastapi", "knowledge-graph"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "google-generativeai>=0.8.0",
    "openai>=1.14.0",
    "anthropic>=0.19.0"
]

[project.scripts]
deepclaw = "cli.deepclaw_cli:main"
